name = "qimen"
main = "src/index.js"
compatibility_date = "2026-05-13"
compatibility_flags = ["nodejs_compat"]
workers_dev = true
preview_urls = true

[vars]
FRONTEND_URL = "https://qimendao.com,https://www.qimendao.com"
SUPABASE_URL = "https://xkbqiiwwgfzkyfhxuoev.supabase.co"
WHITELIST_EMAILS = "linjunyan0726@vip.qq.com,blairzbz1112@gmail.com,caoyuwei819@163.com,joneykovic@gmail.com,chenxinhui1227@gmail.com,anyilin1997@qq.com,hateveryone@foxmail.com"
# LLM 默认直连 DeepSeek：分类/问事/追问/运势用 deepseek-flash，建档/校准用 deepseek-v4-pro（见 worker/src/index.js）
# 可选覆盖：LLM_API_URL / LLM_FAST_MODEL / LLM_DEEP_MODEL / QUESTION_MODEL（仅问事+追问）
# 回退中转站示例：LLM_API_URL = "https://yinli.one/v1/chat/completions"、LLM_FAST_MODEL = "gemini-3-flash-preview"，并把 LLM_API_KEY 换成中转站 key
# Langfuse trace 上报 base URL（JP 区域）
LANGFUSE_BASE_URL = "https://jp.cloud.langfuse.com"
LANGFUSE_TRACING_ENVIRONMENT = "production"

[secrets]
required = [
  "LLM_API_KEY",
  "SUPABASE_SERVICE_KEY",
  "LANGFUSE_PUBLIC_KEY",
  "LANGFUSE_SECRET_KEY"
]

[observability]
enabled = false
head_sampling_rate = 1

[observability.logs]
enabled = true
head_sampling_rate = 1
persist = true
invocation_logs = true

[observability.traces]
enabled = false
persist = true
head_sampling_rate = 1

[env.preview]
name = "qimen-preview"
workers_dev = true

[env.preview.vars]
FRONTEND_URL = "https://qimen-1ff.pages.dev"
SUPABASE_URL = "https://xkbqiiwwgfzkyfhxuoev.supabase.co"
WHITELIST_EMAILS = "linjunyan0726@vip.qq.com,blairzbz1112@gmail.com,caoyuwei819@163.com,joneykovic@gmail.com,chenxinhui1227@gmail.com,anyilin1997@qq.com,hateveryone@foxmail.com"
LANGFUSE_BASE_URL = "https://jp.cloud.langfuse.com"
LANGFUSE_TRACING_ENVIRONMENT = "preview"

[env.preview.secrets]
required = [
  "LLM_API_KEY",
  "SUPABASE_SERVICE_KEY",
  "LANGFUSE_PUBLIC_KEY",
  "LANGFUSE_SECRET_KEY"
]
